name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Module tests
        run: for t in modules/*/tests/test_*.py; do python "$t" || exit 1; done
      - name: Secret and personal-data scan
        run: python tools/scan.py .
      - name: Run pipeline on a scratch copy and validate
        run: |
          mkdir -p /tmp/scratch-data
          python -c "import sys; sys.path.insert(0,'pipeline'); import runner; sys.exit(runner.main(runner.ROOT, '/tmp/scratch-data'))"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "22"}
      - name: Mobile UI test (headless Chrome, fresh data)
        run: |
          npm install --no-save --no-package-lock playwright-core@1.65.1
          DATA=/tmp/scratch-data CHROME="$(which google-chrome)" node tests/ui/ui.test.mjs .
