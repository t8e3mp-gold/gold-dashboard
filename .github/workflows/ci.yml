name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Module tests
        run: for t in modules/*/tests/test_*.py; do python "$t" || exit 1; done
      - name: Run pipeline on a scratch copy and validate
        run: python -c "import sys; sys.path.insert(0,'pipeline'); import runner,tempfile; sys.exit(runner.main(runner.ROOT, tempfile.mkdtemp()))"
