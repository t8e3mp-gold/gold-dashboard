name: Watchdog
# Read-only health check. A red run here means: data too old, a module failed, or the live site is behind the repo.
# GitHub emails failed runs to the repo owner; Instinct also reads this workflow's status.
on:
  schedule: [{cron: "23 */6 * * *"}]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Check repo data, live site and last scheduled refresh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          from datetime import datetime, timezone
          def ts(x): return datetime.fromisoformat(x.replace("Z", "+00:00"))
          now = datetime.now(timezone.utc); bad = []
          repo = json.load(open("data/meta.json"))
          age = (now - ts(repo["generated_at"])).total_seconds() / 3600
          if age > 26: bad.append(f"repo data is {age:.1f}h old (limit 26h)")
          fails = [k for k, m in repo["modules"].items() if m["status"] != "ok"]
          if fails: bad.append("modules not ok: " + ", ".join(fails))
          if repo["manifest_errors"]: bad.append("manifest errors")
          owner, name = os.environ["REPO"].split("/")
          url = f"https://{owner}.github.io/{name}/data/meta.json?w={int(time.time())}"
          try:
              live = json.load(urllib.request.urlopen(url, timeout=30))
              lag = (ts(repo["generated_at"]) - ts(live["generated_at"])).total_seconds() / 3600
              if lag > 2: bad.append(f"live site is {lag:.1f}h behind the repo (deploy problem or cache)")
          except Exception as e:
              bad.append("live site unreachable: " + str(e)[:80])
          def last_run(wf):
              req = urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/{wf}/runs?per_page=10&status=completed",
                                           headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"]})
              return json.load(urllib.request.urlopen(req, timeout=30))["workflow_runs"]
          sched = [r for r in last_run("refresh.yml") if r["event"] == "schedule"]
          if sched:
              r = sched[0]; a = (now - ts(r["updated_at"])).total_seconds() / 3600
              if r["conclusion"] != "success": bad.append(f"last scheduled refresh ended '{r['conclusion']}'")
              if a > 30: bad.append(f"last scheduled refresh was {a:.0f}h ago")
          print("scheduled refresh runs seen:", len(sched))
          print("ALL OK" if not bad else "PROBLEMS: " + " | ".join(bad))
          raise SystemExit(1 if bad else 0)
          PY
