name: Refresh data
on:
  schedule: [{cron: "17 */3 * * *"}]   # every 3 hours on its own; session wakes add extra runs
  workflow_dispatch:
    inputs:
      drill:
        description: "Failure drill: add a module that always fails (nothing is committed to the registry)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Tests first
        run: python -m unittest discover -s tests
      - name: Self-refresh the economic calendar (BLS iCal; leaves the file unchanged if BLS refuses)
        continue-on-error: true
        run: python tools/calendar_sync.py
      - name: Run modules (invalid output is never published; one failure does not block the others)
        id: run
        continue-on-error: true
        env:
          EXTRA_MODULES: ${{ inputs.drill && 'drill' || '' }}
        run: python pipeline/runner.py
      - name: Scan new data for secrets and personal data
        run: python tools/scan.py data
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data modules/news/calendar.json
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +%F)"
          git status --short
          git pull --rebase --autostash origin main
          git push
      - name: Fail the run if any module failed
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::at least one module failed, see 'Run modules' step; other modules were published"
          exit 1
